[package]
name = "lcp-svc-update"
version = "1.1.0"
edition = "2021"
authors = ["Peter Richards"]
description = "Liferay Services Updater - Update Liferay Cloud service Docker image references (LCP.json)."
repository = "https://github.com/peterrichards-lr/lcp-svc-update"
license = "MIT"

[dependencies]
# CLI Argument parsing
clap = { version = "4.4", features = ["derive", "env"] }

# Error handling
anyhow = "1.0"

# Configuration & Data
serde_json = "1.0"

# Dates for release note discovery
chrono = { version = "0.4", default-features = false, features = ["clock"] }

# Fetching & parsing release notes
reqwest = { version = "0.11", features = ["blocking"] }
scraper = "0.18"

[dev-dependencies]
# Required for the unit tests in src/core/env.rs
tempfile = "3.8"
